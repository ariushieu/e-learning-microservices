# CI: build + test toàn bộ Maven multi-module và kiểm tra cú pháp docker-compose.
# Chạy khi push lên main và với mọi pull request nhắm vào main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push mới lên cùng một PR sẽ hủy lần chạy cũ đang dở, tiết kiệm phút chạy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven          # cache ~/.m2 theo hash của các pom.xml

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports (khi fail)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  # Test của các service chạy trên H2 với ddl-auto=create-drop, tức schema được dựng TỪ
  # entity, nên entity lệch migration bao nhiêu thì test vẫn xanh. Job này bắt đúng chỗ đó:
  # database rỗng, Flyway dựng schema từ migration, Hibernate validate đối chiếu lại.
  # Frontend Next.js: cài đúng phiên bản trong pnpm-lock.yaml, kiểm kiểu, lint rồi build thật.
  # Build bắt được lỗi mà tsc bỏ sót, ví dụ trang dùng useSearchParams mà thiếu Suspense.
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm next typegen && pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Enrollment summary display rules
        run: node --test ../scripts/check-enrollment-summary.test.mjs

      - name: Build
        run: pnpm build

  schema:
    name: Schema matches entities (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: elearning
          MYSQL_PASSWORD: elearning
        ports:
          - 3306:3306
        # Không dùng volume init như docker-compose vì các database được tạo ở bước dưới,
        # và phải để chúng RỖNG thì Flyway mới thực sự chạy migration.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Chạy client trong container mysql:8.4 thay vì dùng lệnh mysql của runner, để không
      # phụ thuộc vào việc ảnh runner có sẵn mysql-client hay không. Ảnh này đã được tải về
      # cho service container ở trên nên không tốn thêm thời gian.
      - name: Create empty databases
        run: |
          docker run --rm --network host mysql:8.4 \
            mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
              CREATE DATABASE IF NOT EXISTS auth_db         CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS course_db       CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS enrollment_db   CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS quiz_db         CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS notification_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              GRANT ALL PRIVILEGES ON *.* TO 'elearning'@'%';
              FLUSH PRIVILEGES;"

      - name: Package services
        run: ./mvnw -B -ntp -DskipTests package

      - name: Start each service against MySQL and validate its schema
        run: bash scripts/verify-schema.sh

      - name: Upload service logs (khi fail)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-schema-logs
          path: target/verify-schema/*.log
          retention-days: 7

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: docker compose config
        run: docker compose config --quiet

      # Sáu service ứng dụng nằm trong profile "app"; lệnh trên không đọc tới chúng.
      - name: docker compose config (profile app)
        run: docker compose --profile app config --quiet

  # Chạy cả hệ thống đúng như lúc demo rồi gọi thử từng service qua gateway.
  #
  # Bắt những lỗi chỉ lộ ra khi service chạy trong container: ghi cứng localhost trong
  # application.properties thay vì đọc biến môi trường, đổi tên biến mà quên sửa compose,
  # thêm module mà quên thêm vào Dockerfile. Chạy trong IntelliJ thì những lỗi đó vô hình vì
  # localhost lúc ấy đúng là nơi MySQL đang chạy — phải tới hôm demo mới biết.
  stack:
    name: Full stack in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images
        run: docker compose --profile app build

      - name: Start everything
        run: docker compose --profile app up -d --wait --wait-timeout 300

      - name: Smoke test through the gateway
        run: bash scripts/smoke-test.sh

      - name: Set up Node for Docker acceptance tests
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Auth collection through Docker gateway
        run: |
          set -e
          trap 'RATE_LIMIT_ENABLED=true docker compose --profile app up -d --wait api-gateway' EXIT
          RATE_LIMIT_ENABLED=false docker compose --profile app up -d --wait api-gateway
          mkdir -p target
          pnpm dlx newman@6.2.2 run docs/postman/auth.postman_collection.json \
            --reporters cli,json --reporter-json-export target/auth-newman-report.json

      - name: Sanitize auth acceptance results
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -f target/auth-newman-report.json ]; then
            node scripts/report-auth-newman.cjs target/auth-newman-report.json target/auth-acceptance.json
          fi

      - name: Upload sanitized auth acceptance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-docker-acceptance
          path: target/auth-acceptance.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enrollment collection through Docker gateway
        run: |
          set -e
          trap 'RATE_LIMIT_ENABLED=true docker compose --profile app up -d --wait api-gateway' EXIT
          RATE_LIMIT_ENABLED=false docker compose --profile app up -d --wait --wait-timeout 120 api-gateway
          pnpm dlx newman@6.2.2 run docs/postman/enrollment.postman_collection.json --delay-request 60 --timeout-request 15000 --timeout-script 30000 --reporters cli,json --reporter-json-export "$RUNNER_TEMP/enrollment-newman-report.json"

      - name: Sanitize enrollment acceptance results
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -f "$RUNNER_TEMP/enrollment-newman-report.json" ]; then
            mkdir -p "$RUNNER_TEMP/enrollment-summary-evidence"
            node scripts/report-enrollment-newman.cjs "$RUNNER_TEMP/enrollment-newman-report.json" "$RUNNER_TEMP/enrollment-summary-evidence/docker-http.json"
          fi

      - name: Check enrollment summary in Chromium
        env:
          ENROLLMENT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/enrollment-ui/node_modules/playwright
          ENROLLMENT_UI_OUTPUT: ${{ runner.temp }}/enrollment-summary-evidence
        run: |
          npm install --prefix "$RUNNER_TEMP/enrollment-ui" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/enrollment-ui/node_modules/playwright/cli.js" install --with-deps chromium
          node scripts/check-enrollment-summary-ui.cjs

      - name: Upload enrollment UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enrollment-summary-ui
          path: ${{ runner.temp }}/enrollment-summary-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Container status and logs (khi fail)
        if: failure()
        run: |
          docker compose --profile app ps
          docker compose --profile app logs --no-color --tail=150

  # Job "Schema matches entities" không bắt được việc sửa một migration đã merge, vì CI luôn
  # dựng database mới tinh nên bản sửa lúc nào cũng chạy trót lọt. Lỗi chỉ hiện trên máy đã
  # có sẵn database, tức máy của mọi người trừ người viết. Job này nhìn vào diff thay vì
  # nhìn vào kết quả chạy.
  migrations:
    name: Merged migrations unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # cần cả base lẫn head để so diff

      - name: Check migration files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-migrations.sh "$BASE_SHA" "$HEAD_SHA"

  # elearning.security.enabled=false không làm service hỏng: nó gán cho mọi request cùng
  # một danh tính giả lập, nên mọi endpoint vẫn trả 200 và mọi test vẫn xanh trong khi dữ
  # liệu của mọi người dồn về một tài khoản. Không job nào khác bắt được — kể cả job chạy cả
  # hệ thống, vì gateway vẫn đòi token ở vòng ngoài. Job này nhìn thẳng vào file cấu hình.
  security-config:
    name: Security enabled in committed config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check that no committed config disables authentication
        run: bash scripts/check-security-config.sh

  # Chặn commit sai quy ước ở tầng pull request, phòng khi ai đó chưa bật git hook.
  # Tiêu đề PR kiểm ở workflow riêng pr-title.yml, vì nó phải chạy lại mỗi khi sửa tiêu đề.
  commit-style:
    name: Commit message style
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # cần đủ lịch sử để liệt kê commit của nhánh

      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            bash scripts/check-commit-subject.sh "$subject" "Tiêu đề commit" || status=1
          done < <(git log --format='%s' "$BASE_SHA".."$HEAD_SHA")
          exit $status
