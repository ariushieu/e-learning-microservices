spring.application.name=quiz-service
server.port=8084

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quiz_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:elearning}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:elearning}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =============================================================================
# Xac thuc (shared-common tu bat, xem docs/shared-contracts.md)
# =============================================================================
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}
# Khong endpoint nao cua quiz cong khai: xem de, lam bai va xem ket qua deu phai dang nhap.
elearning.security.public-paths=/actuator/**
