# Profile dev: Dùng H2 in-memory mode MySQL để test nhanh bằng Postman mà không cần cấu hình MySQL/Kafka
spring.datasource.url=jdbc:h2:mem:quiz_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.flyway.enabled=false

# Tắt gửi Kafka trong profile dev (không cần broker Kafka)
spring.kafka.enabled=false
