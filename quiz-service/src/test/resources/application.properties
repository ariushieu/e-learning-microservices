spring.application.name=quiz-service-test
server.port=0

# In-Memory H2 DB for testing
spring.datasource.url=jdbc:h2:mem:quiz_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway in tests
spring.flyway.enabled=false

# Disable Kafka in tests
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092

# =============================================================================
# Xac thuc
# =============================================================================
# Tat trong test de khong phai khai khoa ky o moi file test. Test nao can kiem tra
# phan bao mat thi bat lai bang @SpringBootTest(properties = ...).
elearning.security.enabled=false
