spring.application.name=enrollment-service
server.port=8083

# Course Service sở hữu danh sách bài học; bắt buộc khi cập nhật tiến độ.
app.course-service-url=${COURSE_SERVICE_URL:http://localhost:8082}

# =============================================================================
# Datasource (MySQL - enrollment_db)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/enrollment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:elearning}
spring.datasource.password=${DB_PASSWORD:elearning}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Flyway Migration
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Xac thuc (shared-common tu bat, xem docs/shared-contracts.md)
# =============================================================================
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}
# Mo cong khai actuator de kiem tra health
elearning.security.public-paths=/actuator/**,GET:/api/certificates/verify/*

# =============================================================================
# Kafka Producer (Transactional Outbox Publisher)
# =============================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer dùng group riêng, đọc cả sự kiện có trước lần khởi động đầu tiên.
spring.kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.consumer.group-id=enrollment-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Khoảng chờ giữa các lần retry; lỗi không thể phục hồi đi thẳng sang .DLT.
elearning.kafka.retry.initial-interval=${KAFKA_RETRY_INITIAL_INTERVAL:1s}
elearning.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2}
elearning.kafka.retry.max-interval=${KAFKA_RETRY_MAX_INTERVAL:30s}
elearning.kafka.retry.max-elapsed-time=${KAFKA_RETRY_MAX_ELAPSED_TIME:5m}

# =============================================================================
# Outbox Publisher Worker
# =============================================================================
app.outbox.publisher.delay-ms=3000

# =============================================================================
# Bảng xếp hạng (Redis sorted set, MySQL là nguồn sự thật)
# =============================================================================
# Chạy trong IntelliJ thì Redis ở localhost (docker compose up -d đã bật sẵn); trong Docker
# thì compose đặt REDIS_HOST=redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis chậm hay chết thì quay về MySQL ngay, không bắt người xem chờ.
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
# Mất Redis chỉ làm bảng xếp hạng chậm hơn; không để Docker coi cả service hỏng.
management.health.redis.enabled=false
# Bảng xếp hạng trong Redis tự hết hạn sau khoảng này, kể cả khi không ai học thêm.
elearning.leaderboard.cache-ttl=${LEADERBOARD_CACHE_TTL:10m}
