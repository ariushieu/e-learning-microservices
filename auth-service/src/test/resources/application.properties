spring.application.name=auth-service-test
server.port=0

# H2 In-Memory Database for Test Suite
spring.datasource.url=jdbc:h2:mem:auth_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates schema for tests
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT Properties for Test
jwt.secret=elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes
jwt.access-token-expiration-ms=60000
jwt.refresh-token-expiration-ms=600000
