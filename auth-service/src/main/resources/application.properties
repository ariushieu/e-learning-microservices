spring.application.name=auth-service
server.port=8081

# Database & DataSource (MySQL auth_db)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:elearning}
spring.datasource.password=${DB_PASSWORD:elearning}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
jwt.secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}
# 15 minutes = 900000 ms
jwt.access-token-expiration-ms=900000
# 7 days = 604800000 ms
jwt.refresh-token-expiration-ms=604800000

# =============================================================================
# Xác thực (shared-common tự bật, xem docs/shared-contracts.md)
# =============================================================================
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}
# Đăng nhập, đăng ký, làm mới và đăng xuất phải công khai: đòi token ở đây thì
# không ai lấy được token đầu tiên. /api/auth/me vẫn cần token.
elearning.security.public-paths=/actuator/**,/api/auth/login,/api/auth/register,/api/auth/refresh-token,/api/auth/logout
