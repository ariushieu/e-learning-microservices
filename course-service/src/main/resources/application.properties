spring.application.name=course-service
server.port=8082

# =============================================================================
# Datasource (MySQL - course_db)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/course_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:elearning}
spring.datasource.password=${DB_PASSWORD:elearning}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Flyway Migration
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Kafka
# =============================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =============================================================================
# Xac thuc (shared-common tu bat, xem docs/shared-contracts.md)
# =============================================================================
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}
# Khach chua dang nhap phai xem duoc danh muc va khoa hoc, nen mo GET.
# Tien to GET: la bat buoc - mo ca /api/courses/** theo duong dan thi POST tao
# khoa hoc va DELETE xoa khoa hoc cung thanh cong khai.
elearning.security.public-paths=/actuator/**,GET:/api/courses/**,GET:/api/categories/**,GET:/api/sections/**,GET:/api/lessons/**
