spring.application.name=course-service
server.port=8082

# =============================================================================
# H2 In-Memory DB for Tests (MySQL mode)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:course_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable Flyway during tests so H2 uses Hibernate DDL to initialize tables
spring.flyway.enabled=false

# Disable Kafka in tests
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092

# =============================================================================
# Xac thuc
# =============================================================================
# Tat trong test de khong phai khai khoa ky o moi file test. Test nao can kiem tra
# phan bao mat thi bat lai bang @SpringBootTest(properties = ...).
elearning.security.enabled=false
