# Hai cách dùng file này.
#
# 1. Lập trình hằng ngày — chỉ bật hạ tầng, các service chạy trong IntelliJ và nối qua
#    localhost:
#
#      docker compose up -d                 # MySQL + Kafka + Kafka UI
#      docker compose up -d mysql           # hoặc chỉ những gì cần
#
# 2. Chạy toàn bộ hệ thống — cả 6 service cũng chạy trong Docker, chỉ gateway mở ra ngoài
#    ở cổng 8080. Dùng để demo hoặc kiểm tra các service nói chuyện được với nhau:
#
#      docker compose --profile app up -d --build --wait
#      docker compose --profile app down    # dừng, GIỮ dữ liệu
#
# Sáu service nằm trong profile "app" nên cách 1 không bật chúng lên: không chiếm cổng
# 8081-8085 của service đang chạy trong IntelliJ, không tốn thời gian build image.
#
#   docker compose ps                       # xem trạng thái / healthcheck
#   docker compose logs -f kafka
#   docker compose down -v                  # dừng và XÓA dữ liệu (volume)

name: elearning

# =============================================================================
# Cấu hình chung cho 6 service ứng dụng
# =============================================================================
# Khóa ký JWT phải GIỐNG NHAU ở mọi service, nên khai một lần ở đây. Đổi trong .env là
# cả 6 service nhận cùng giá trị; khai riêng từng chỗ thì sớm muộn sẽ có chỗ quên đổi, và
# token auth-service ký ra sẽ bị service đó từ chối.
x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:-elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}

# Service chạy trong Docker gọi MySQL và Kafka bằng tên service trong mạng compose, không
# phải localhost — localhost trong container là chính container đó. Kafka dùng listener
# INTERNAL (kafka:29092) đã khai sẵn ở dưới cho đúng mục đích này.
x-backend-env: &backend-env
  <<: *jwt
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: ${MYSQL_USER:-elearning}
  DB_PASSWORD: ${MYSQL_PASSWORD:-elearning}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-app: &app
  profiles: ["app"]
  restart: unless-stopped
  # Giới hạn bộ nhớ để 6 JVM không giành nhau RAM của máy. Dockerfile đặt heap tối đa
  # 75% con số này; không giới hạn thì mỗi JVM thấy toàn bộ RAM của Docker và được phép
  # phình tới hàng chục GB.
  mem_limit: 768m

x-backend-depends: &backend-depends
  mysql:
    condition: service_healthy
  kafka:
    condition: service_healthy

# Spring Boot 4 khởi động mất 15-40 giây tùy máy; start_period cho khoảng đó không bị
# tính là lỗi.
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:

  # ---------------------------------------------------------------- MySQL
  mysql:
    image: mysql:8.4
    container_name: elearning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-elearning}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elearning}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Tên bảng không phân biệt hoa/thường, giống MySQL trên Windows -> tránh lỗi khi chuyển môi trường
      - --lower_case_table_names=1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Script tạo 5 database (một database cho mỗi service), chỉ chạy lần khởi tạo đầu tiên
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: elearning-kafka
    restart: unless-stopped
    ports:
      # Cho ứng dụng chạy trên máy host (IntelliJ) kết nối: localhost:9092
      - "9092:9092"
    environment:
      # KRaft: một node vừa là broker vừa là controller, không cần ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Hai listener cho client:
      #   INTERNAL  kafka:29092     -> container khác trong mạng compose (kafka-ui, sau này là các service khi chạy trong Docker)
      #   EXTERNAL  localhost:9092  -> ứng dụng chạy trên máy host
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single node -> replication factor = 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Tiện cho dev: producer gửi vào topic chưa có thì tự tạo với 3 partition
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Cố định cluster id để khởi động lại container vẫn đọc được dữ liệu cũ trong volume
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------- Kafka UI
  # Giao diện web xem topic, partition, message, consumer group: http://localhost:8090
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: elearning-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: elearning-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ================================================================ Ứng dụng
  # Chỉ bật khi thêm --profile app. Không service nào mở cổng ra máy host trừ gateway:
  # mọi request đi qua một cửa duy nhất, đúng như kiến trúc vẽ trong README. Gọi thẳng
  # service thì dùng "docker compose exec <service> curl localhost:<cổng>/...".

  auth-service:
    <<: *app
    build: { context: ., args: { SERVICE: auth-service } }
    image: elearning/auth-service
    container_name: elearning-auth-service
    environment:
      <<: *backend-env
    depends_on: *backend-depends
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]

  course-service:
    <<: *app
    build: { context: ., args: { SERVICE: course-service } }
    image: elearning/course-service
    container_name: elearning-course-service
    environment:
      <<: *backend-env
    depends_on: *backend-depends
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]

  enrollment-service:
    <<: *app
    build: { context: ., args: { SERVICE: enrollment-service } }
    image: elearning/enrollment-service
    container_name: elearning-enrollment-service
    environment:
      <<: *backend-env
    depends_on: *backend-depends
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]

  quiz-service:
    <<: *app
    build: { context: ., args: { SERVICE: quiz-service } }
    image: elearning/quiz-service
    container_name: elearning-quiz-service
    environment:
      <<: *backend-env
      # quiz-service đọc cả chuỗi kết nối thay vì DB_HOST như bốn service kia, nên phải
      # truyền nguyên URL. DB_HOST ở trên vô hại với nó.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/quiz_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-elearning}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-elearning}
    depends_on: *backend-depends
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]

  notification-service:
    <<: *app
    build: { context: ., args: { SERVICE: notification-service } }
    image: elearning/notification-service
    container_name: elearning-notification-service
    environment:
      <<: *backend-env
    depends_on: *backend-depends
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]

  api-gateway:
    <<: *app
    build: { context: ., args: { SERVICE: api-gateway } }
    image: elearning/api-gateway
    container_name: elearning-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *jwt
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      QUIZ_SERVICE_URL: http://quiz-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    # service_started chứ không phải service_healthy: một service hỏng thì gateway vẫn lên
    # và trả 502 cho riêng đường dẫn của service đó, thay vì kéo sập cả hệ thống. Đây cũng
    # là thứ đáng demo nhất của microservices — một phần chết, phần còn lại vẫn chạy.
    depends_on:
      auth-service: { condition: service_started }
      course-service: { condition: service_started }
      enrollment-service: { condition: service_started }
      quiz-service: { condition: service_started }
      notification-service: { condition: service_started }
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

volumes:
  mysql_data:
  kafka_data:
