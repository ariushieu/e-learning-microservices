spring.application.name=notification-service
server.port=8085

# =============================================================================
# Datasource (MySQL - notification_db)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:elearning}
spring.datasource.password=${DB_PASSWORD:elearning}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / Hibernate
# =============================================================================
# validate chứ không phải update: schema do Flyway dựng, Hibernate chỉ đối chiếu.
# Lệch một cột là service không khởi động, đúng ý đồ - xem scripts/verify-schema.sh.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# =============================================================================
# Flyway Migration
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Kafka: service này chỉ nhận sự kiện, không phát
# =============================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service

# Đọc chuỗi thô rồi tự phân tích, không dùng JsonDeserializer. Lý do ở
# KafkaEventConsumer: định tuyến theo trường eventType trong message, không theo
# tên lớp Java mà bên gửi gắn vào header.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# earliest: consumer mới tham gia sẽ đọc lại từ đầu topic thay vì bỏ qua những gì đã có.
# An toàn vì bảng processed_events lọc trùng, đọc lại không sinh thông báo lặp.
spring.kafka.consumer.auto-offset-reset=earliest

# Đặt false trên máy không chạy Kafka: service vẫn khởi động, chỉ không nghe sự kiện.
spring.kafka.enabled=${KAFKA_ENABLED:true}

# =============================================================================
# Xac thuc (shared-common tu bat, xem docs/shared-contracts.md)
# =============================================================================
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}
# Hộp thư là dữ liệu riêng của từng người, không endpoint nào công khai.
elearning.security.public-paths=/actuator/**
