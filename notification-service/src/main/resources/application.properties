spring.application.name=notification-service
server.port=8085

# =============================================================================
# Datasource (MySQL - notification_db)
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:elearning}
spring.datasource.password=${DB_PASSWORD:elearning}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / Hibernate
# =============================================================================
# validate chứ không phải update: schema do Flyway dựng, Hibernate chỉ đối chiếu.
# Lệch một cột là service không khởi động, đúng ý đồ - xem scripts/verify-schema.sh.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# =============================================================================
# Flyway Migration
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Kafka: service này chỉ nhận sự kiện. Thứ duy nhất nó gửi đi là message hỏng sang topic .DLT
# =============================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service

# Đọc chuỗi thô rồi tự phân tích, không dùng JsonDeserializer. Lý do ở
# KafkaEventConsumer: định tuyến theo trường eventType trong message, không theo
# tên lớp Java mà bên gửi gắn vào header.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# earliest: consumer mới tham gia sẽ đọc lại từ đầu topic thay vì bỏ qua những gì đã có.
# An toàn vì bảng processed_events lọc trùng, đọc lại không sinh thông báo lặp.
spring.kafka.consumer.auto-offset-reset=earliest

# Đặt false trên máy không chạy Kafka: service vẫn khởi động, chỉ không nghe sự kiện.
spring.kafka.enabled=${KAFKA_ENABLED:true}

# Xử lý sự kiện bị lỗi thì thử lại, chờ 1s, 2s, 4s… tối đa 30s mỗi lần. Tổng thời gian chờ
# quá 5 phút vẫn lỗi thì chuyển sang topic <tên topic>.DLT — thời gian thật dài hơn, khoảng
# 10-12 phút khi MySQL tắt hẳn, vì mỗi lần thử còn đợi kết nối. Message hỏng (JSON sai, thiếu
# trường) sang .DLT ngay, không chờ. Lý do ở KafkaErrorHandlingConfig.
elearning.kafka.retry.initial-interval=1s
elearning.kafka.retry.multiplier=2
elearning.kafka.retry.max-interval=30s
elearning.kafka.retry.max-elapsed-time=${KAFKA_RETRY_MAX_ELAPSED:5m}

# Gửi sang .DLT dùng KafkaTemplate mà Spring Boot tự tạo; message giữ nguyên chuỗi gốc.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =============================================================================
# Xac thuc (shared-common tu bat, xem docs/shared-contracts.md)
# =============================================================================
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}
# Hộp thư là dữ liệu riêng của từng người, không endpoint nào công khai.
elearning.security.public-paths=/actuator/**

# =============================================================================
# Thông báo tức thời (SSE + Redis pub/sub), xem docs/notifications.md
# =============================================================================
# Chạy trong IntelliJ thì Redis ở localhost (docker compose up -d đã bật sẵn); trong Docker
# thì compose đặt REDIS_HOST=redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis chết thì thông báo vẫn được lưu và vẫn đến được người đang nối vào chính bản service
# này; frontend tự hỏi lại số chưa đọc khi mất luồng. Chờ Redis lâu chỉ làm consumer Kafka
# treo theo, nên quá nửa giây là coi như không có.
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
# Không để Redis kéo /actuator/health xuống DOWN: mất Redis chỉ mất phần "tức thời", hộp thư
# vẫn đọc được. Báo DOWN thì Docker coi cả service hỏng.
management.health.redis.enabled=false

# false: chỉ phát cho người đang nối vào chính bản này, không cần Redis (chạy một bản, test).
elearning.realtime.redis-enabled=${REALTIME_REDIS_ENABLED:true}
# Đóng luồng sau 15 phút để trình duyệt nối lại với token mới: luồng chỉ kiểm token lúc mở.
elearning.realtime.stream-timeout=15m
# Gửi một dòng rỗng định kỳ để proxy không cắt luồng vì "im lặng quá lâu" và để phát hiện
# trình duyệt đã đóng tab.
elearning.realtime.heartbeat-interval=25s
# Một người mở nhiều tab là bình thường, nhưng không để một tài khoản giữ vô hạn kết nối.
elearning.realtime.max-streams-per-user=5

# =============================================================================
# Email: EmailDispatcher gửi hàng đợi email qua SMTP. Chạy Docker thì là Mailpit
# (xem thư ở http://localhost:8025); máy chủ thật chỉ cần đổi các biến MAIL_*.
# =============================================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Mail hỏng thì email nằm chờ gửi lại, service vẫn khỏe: không để health DOWN vì SMTP.
management.health.mail.enabled=false
elearning.mail.enabled=${MAIL_ENABLED:true}
elearning.mail.from=${MAIL_FROM:E-Learning HUNRE <no-reply@hunre.edu.vn>}
# Địa chỉ web để dựng link trong email
elearning.web.base-url=${WEB_BASE_URL:http://localhost:3000}
