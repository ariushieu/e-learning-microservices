# Cau hinh rieng cho test

# =============================================================================
# H2 in-memory, schema dung tu entity
# =============================================================================
spring.datasource.url=jdbc:h2:mem:notification_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Test dung schema tu entity nen khong chay migration.
# Viec doi chieu entity voi migration do job CI "Schema matches entities" lo,
# xem scripts/verify-schema.sh.
spring.flyway.enabled=false

# =============================================================================
# Kafka
# =============================================================================
# Khong co broker trong test. Tat listener de context khoi dong duoc; phan xu ly
# su kien duoc test truc tiep qua EventProcessor, khong can Kafka that.
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-test

# =============================================================================
# Xac thuc
# =============================================================================
# Tat trong test de khong phai khai khoa ky o moi file test. Test nao can kiem tra
# phan bao mat thi bat lai bang @SpringBootTest(properties = ...).
elearning.security.enabled=false
