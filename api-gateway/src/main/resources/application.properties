spring.application.name=api-gateway
server.port=8080

# =============================================================================
# Xác thực
# =============================================================================
# Gateway kiểm token ngay ở vòng ngoài để request hỏng không phải đi tiếp vào trong.
# Các service phía sau vẫn kiểm lại một lần nữa: gọi thẳng localhost:8082 là bỏ qua
# được gateway, nên gateway không phải là hàng rào duy nhất.
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}

# Đường dẫn không cần token. Phải mở đăng nhập và đăng ký, nếu không thì không ai
# lấy được token đầu tiên.
#
# Tiền tố GET: giới hạn theo phương thức. Khách chưa đăng nhập xem được danh mục và
# khóa học, nhưng POST tạo và DELETE xóa thì vẫn phải đăng nhập. Danh sách này phải
# khớp với elearning.security.public-paths của course-service — lệch nhau thì gateway
# cho qua rồi service chặn, người dùng nhận 401 mà không hiểu vì sao.
# GET đánh giá nằm dưới /api/courses/**; reviews/me vẫn được course-service xác thực riêng.
elearning.security.public-paths=/actuator/**,/api/auth/login,/api/auth/register,/api/auth/refresh-token,/api/auth/logout,GET:/api/courses/**,GET:/api/categories/**,GET:/api/sections/**,GET:/api/lessons/**,GET:/api/instructors/*,GET:/api/certificates/verify/*

# =============================================================================
# Định tuyến
# =============================================================================
# Host và port lấy từ biến môi trường để sau này chạy docker compose chỉ cần đổi biến,
# không phải sửa file này.
elearning.services.auth=${AUTH_SERVICE_URL:http://localhost:8081}
elearning.services.course=${COURSE_SERVICE_URL:http://localhost:8082}
elearning.services.enrollment=${ENROLLMENT_SERVICE_URL:http://localhost:8083}
elearning.services.quiz=${QUIZ_SERVICE_URL:http://localhost:8084}
elearning.services.notification=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

# Chờ kết nối tới service đích tối đa 3 giây. Mặc định là 30 giây: tắt một service là mọi
# request tới nó treo nửa phút rồi mới nhận 502, và frontend treo theo. Các service nằm cùng
# máy hoặc cùng mạng Docker, kết nối lành thì mất vài mili giây — quá 3 giây nghĩa là service
# không có ở đó.
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${elearning.services.auth}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# course-service giữ 4 nhóm đường dẫn: khóa học, danh mục, chương và bài học
spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=${elearning.services.course}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/courses/**,/api/categories/**,/api/sections/**,/api/lessons/**,/api/instructor/reviews,/api/instructors/**

# enrollment-service giữ hai nhóm: ghi danh và tiến độ học.
#
# /api/progress/** từng bị bỏ sót ở đây, nên toàn bộ ProgressController không gọi được qua
# gateway: token hợp lệ vẫn nhận 404, vì gateway không có route nào khớp thì trả 404 chứ
# không phải chuyển tiếp. Danh sách này phải khớp với @RequestMapping của service —
# GatewayRouteCoverageTest kiểm đúng việc đó.
#
# Xác minh công khai dùng /api/certificates/verify/{code}; chứng chỉ riêng của chủ sở hữu
# vẫn ở GET /api/enrollments/{id}/certificate.
spring.cloud.gateway.server.webflux.routes[2].id=enrollment-service
spring.cloud.gateway.server.webflux.routes[2].uri=${elearning.services.enrollment}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/enrollments/**,/api/progress/**,/api/certificates/**

spring.cloud.gateway.server.webflux.routes[3].id=quiz-service
spring.cloud.gateway.server.webflux.routes[3].uri=${elearning.services.quiz}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/quizzes/**,/api/attempts/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=${elearning.services.notification}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**

# Route cụ thể phải đứng trước /api/lessons/** của course-service.
# Chỉ PUT cập nhật tiến độ thuộc enrollment; GET bài học vẫn đến course-service.
spring.cloud.gateway.server.webflux.routes[5].id=enrollment-lesson-progress
spring.cloud.gateway.server.webflux.routes[5].order=-10
spring.cloud.gateway.server.webflux.routes[5].uri=${elearning.services.enrollment}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/lessons/{lessonId}/progress
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=PUT

# Enrollment owns the learner roster; other course reads remain with course-service.
# GET /api/courses/** is public at the gateway, so enrollment must enforce JWT itself.
spring.cloud.gateway.server.webflux.routes[6].id=enrollment-course-learners
spring.cloud.gateway.server.webflux.routes[6].order=-10
spring.cloud.gateway.server.webflux.routes[6].uri=${elearning.services.enrollment}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/courses/{courseId}/learners,/api/courses/{courseId}/learners/summary
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=GET

# =============================================================================
# Giới hạn request (Redis)
# =============================================================================
# Bộ đếm nằm trong Redis để nhiều bản gateway dùng chung, xem RateLimitGatewayFilter.
# Chạy trong IntelliJ thì Redis ở localhost (docker compose up -d đã bật sẵn); trong Docker
# thì compose đặt REDIS_HOST=redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis chết thì gateway cho request qua luôn (xem RateLimitGatewayFilter). Mặc định Lettuce
# chờ kết nối tới 10 giây — tức mỗi request treo 10 giây rồi mới được cho qua. Redis nằm cùng
# máy, trả lời trong vài mili giây; quá nửa giây là không có ở đó.
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
# Không để Redis kéo /actuator/health xuống DOWN: Redis chết thì gateway vẫn phục vụ được,
# chỉ mất giới hạn request. Báo DOWN thì Docker coi gateway hỏng và cả hệ thống mất cổng vào.
management.health.redis.enabled=false

# Đăng nhập, đăng ký, tính theo tài khoản (email): 10 lần mỗi phút.
# Mỗi lần lấy 6 token, mỗi giây nạp 1 token -> 6 giây được thêm một lần; xô chứa 60 token
# -> dồn được tối đa 10 lần liền. Đủ cho người gõ sai mật khẩu vài lần, quá chậm để dò.
elearning.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
elearning.rate-limit.login.replenish-rate=1
elearning.rate-limit.login.requested-tokens=6
elearning.rate-limit.login.burst-capacity=60
# Đăng nhập, đăng ký, làm mới token, tính theo IP: dồn 60 lần, sau đó 30 lần mỗi phút.
# Mọi người đăng nhập trên web đều mang IP của container frontend, nên xô này phải đủ cho
# cả lớp đăng nhập cùng lúc; nó chỉ để chặn một máy thử hàng loạt tài khoản.
elearning.rate-limit.login-ip.replenish-rate=1
elearning.rate-limit.login-ip.requested-tokens=2
elearning.rate-limit.login-ip.burst-capacity=120
# Mọi đường dẫn khác, tính theo người dùng: 20 request mỗi giây, dồn tối đa 40. Một trang
# frontend mở ra gọi cùng lúc chục API là chuyện thường, nên phải rộng hơn hẳn đăng nhập.
elearning.rate-limit.api.replenish-rate=20
elearning.rate-limit.api.burst-capacity=40

# =============================================================================
# CORS
# =============================================================================
# Frontend Next.js sẽ chạy ở cổng khác nên trình duyệt coi là khác origin.
# Khai ở gateway một lần, 5 service phía sau không phải khai lại.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

management.endpoints.web.exposure.include=health,info,gateway
