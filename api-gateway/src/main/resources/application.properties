spring.application.name=api-gateway
server.port=8080

# =============================================================================
# Xác thực
# =============================================================================
# Gateway kiểm token ngay ở vòng ngoài để request hỏng không phải đi tiếp vào trong.
# Các service phía sau vẫn kiểm lại một lần nữa: gọi thẳng localhost:8082 là bỏ qua
# được gateway, nên gateway không phải là hàng rào duy nhất.
elearning.security.enabled=true
elearning.security.jwt-secret=${JWT_SECRET:elearning-microservices-auth-service-jwt-secret-key-for-local-dev-only-32bytes}

# Đường dẫn không cần token. Phải mở đăng nhập và đăng ký, nếu không thì không ai
# lấy được token đầu tiên.
#
# Tiền tố GET: giới hạn theo phương thức. Khách chưa đăng nhập xem được danh mục và
# khóa học, nhưng POST tạo và DELETE xóa thì vẫn phải đăng nhập. Danh sách này phải
# khớp với elearning.security.public-paths của course-service — lệch nhau thì gateway
# cho qua rồi service chặn, người dùng nhận 401 mà không hiểu vì sao.
elearning.security.public-paths=/actuator/**,/api/auth/login,/api/auth/register,/api/auth/refresh-token,/api/auth/logout,GET:/api/courses/**,GET:/api/categories/**,GET:/api/sections/**,GET:/api/lessons/**

# =============================================================================
# Định tuyến
# =============================================================================
# Host và port lấy từ biến môi trường để sau này chạy docker compose chỉ cần đổi biến,
# không phải sửa file này.
elearning.services.auth=${AUTH_SERVICE_URL:http://localhost:8081}
elearning.services.course=${COURSE_SERVICE_URL:http://localhost:8082}
elearning.services.enrollment=${ENROLLMENT_SERVICE_URL:http://localhost:8083}
elearning.services.quiz=${QUIZ_SERVICE_URL:http://localhost:8084}
elearning.services.notification=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${elearning.services.auth}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# course-service giữ 4 nhóm đường dẫn: khóa học, danh mục, chương và bài học
spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=${elearning.services.course}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/courses/**,/api/categories/**,/api/sections/**,/api/lessons/**

# enrollment-service giữ hai nhóm: ghi danh và tiến độ học.
#
# /api/progress/** từng bị bỏ sót ở đây, nên toàn bộ ProgressController không gọi được qua
# gateway: token hợp lệ vẫn nhận 404, vì gateway không có route nào khớp thì trả 404 chứ
# không phải chuyển tiếp. Danh sách này phải khớp với @RequestMapping của service —
# GatewayRouteCoverageTest kiểm đúng việc đó.
#
# /api/certificates/** đã bỏ: không controller nào phục vụ đường dẫn đó. Chứng chỉ nằm ở
# GET /api/enrollments/{id}/certificate, thuộc nhóm /api/enrollments/**.
spring.cloud.gateway.server.webflux.routes[2].id=enrollment-service
spring.cloud.gateway.server.webflux.routes[2].uri=${elearning.services.enrollment}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/enrollments/**,/api/progress/**

spring.cloud.gateway.server.webflux.routes[3].id=quiz-service
spring.cloud.gateway.server.webflux.routes[3].uri=${elearning.services.quiz}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/quizzes/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=${elearning.services.notification}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**

# =============================================================================
# CORS
# =============================================================================
# Frontend Next.js sẽ chạy ở cổng khác nên trình duyệt coi là khác origin.
# Khai ở gateway một lần, 5 service phía sau không phải khai lại.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

management.endpoints.web.exposure.include=health,info,gateway
